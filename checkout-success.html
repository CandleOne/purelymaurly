<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Complete</title>
<link rel="stylesheet" href="styles.css"><style>body{font-family:system-ui;background:#f5f6f8;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#111} .box{background:#fff;padding:38px 50px;border-radius:28px;max-width:520px;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.25);} h1{margin:0 0 14px;font-size:2rem;} p{margin:0 0 18px;font-size:.9rem;line-height:1.5;} a.btn{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:12px 26px;border-radius:14px;font-weight:600;letter-spacing:.05em;font-size:.8rem;} .small{font-size:.65rem;color:#555;margin-top:14px}</style></head>
<body><div class="box"><h1>Thank You!</h1><p>Your payment was processed successfully.<br>We're preparing your order now.</p><div id="details" class="small">Loading details...</div><p><a href="index.html" class="btn">Return Home</a></p></div>
<script>
(async()=>{const p=new URLSearchParams(location.search);const sid=p.get('sid');if(!sid){document.getElementById('details').textContent='Session missing';return;}try{const r=await fetch('/api/checkout/session/'+sid);const d=await r.json();if(r.ok&&d.ok){document.getElementById('details').textContent='Total: $'+(d.amount_total/100).toFixed(2)+' '+d.currency.toUpperCase();}else{document.getElementById('details').textContent='Could not load details';}}catch{document.getElementById('details').textContent='Network error';}})();
</script></body></html>

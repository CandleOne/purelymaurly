services:
  - type: web
    name: purelymaurly
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -w 2 -k gthread -b 0.0.0.0:$PORT backend.app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/app.db
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: ENABLE_AUTOMATIC_TAX
        value: "0"
      - key: ALLOW_FAKE_CHECKOUT
        value: "1"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
